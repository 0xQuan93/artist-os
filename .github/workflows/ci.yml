name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check

  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/artistos-remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/artistos-remotion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
